<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Competition Leaderboard</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background-gradient"></div>
    
    <main class="container" style="max-width: 600px;">
        <section class="card fade-in">
            <header class="header">
                <h1>Leaderboard</h1>
                <p class="subtitle">Top Referrers</p>
            </header>

            <div class="leaderboard-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Name</th>
                            <th>Referrals</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body">
                        <!-- Rows will be injected here -->
                        <tr>
                            <td colspan="3" style="text-align: center; color: var(--text-secondary);">Loading...</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <div style="margin-top: 30px; text-align: center;">
                <a href="/" class="icon-button" style="width: auto; padding: 0 20px; display: inline-flex; text-decoration: none;">Back to Home</a>
            </div>
        </section>
    </main>

    <script>
        async function loadLeaderboard() {
            try {
                const response = await fetch('/api/leaderboard');
                const data = await response.json();
                
                const tbody = document.getElementById('leaderboard-body');
                tbody.innerHTML = '';

                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No referrals yet.</td></tr>';
                    return;
                }

                data.forEach((user, index) => {
                    const row = document.createElement('tr');
                    // Top 3 highlighting
                    let rankClass = '';
                    if (index === 0) rankClass = 'rank-1';
                    if (index === 1) rankClass = 'rank-2';
                    if (index === 2) rankClass = 'rank-3';

                    row.innerHTML = `
                        <td class="${rankClass}">#${index + 1}</td>
                        <td>${user.name}</td>
                        <td class="count">${user.referrals}</td>
                    `;
                    tbody.appendChild(row);
                });
            } catch (error) {
                console.error('Error loading leaderboard:', error);
            }
        }

        loadLeaderboard();
    </script>
</body>
</html>
